name: FWBSocial
options:
  bundleIdPrefix: events.fwb
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: NVT8G575R7
    TARGETED_DEVICE_FAMILY: "1"  # iPhone-only v1 — iPad needs its own design pass + screenshots

schemes:
  FWBSocial:
    build:
      targets:
        FWBSocial: all
        FWBSocialNotificationService: all
    test:
      targets:
        - FWBSocialTests

  # Separate scheme: the smoke test registers a real account on the LIVE server
  # and deletes it again, so it must never ride along with the unit tests on
  # every plain `xcodebuild test`. Run it deliberately.
  FWBSocialSmoke:
    build:
      targets:
        FWBSocial: all
        FWBSocialUITests: [test]
    test:
      targets:
        - FWBSocialUITests

targets:
  FWBSocial:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FWBSocial
        excludes:
          - "FWBSocial.entitlements"
    dependencies:
      # Embeds the NSE into the app bundle. Without this the extension builds
      # but is never installed, and every chat push stays a contentless banner.
      - target: FWBSocialNotificationService
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: events.fwb.social
        PRODUCT_NAME: FWBSocial
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: FWBSocial
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Sign in with Apple (Guideline 4.8) + Declared Age Range (commissioner
        # Q16) + APNs. See FWBSocial.entitlements for the portal capabilities
        # each one needs enabled on App ID `events.fwb.social`.
        CODE_SIGN_ENTITLEMENTS: FWBSocial/FWBSocial.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        # A release build's APNs token is a production token; saying otherwise
        # makes it silently undeliverable.
        Release:
          APS_ENVIRONMENT: production
    info:
      path: FWBSocial/Info.plist
      properties:
        # "fwb" is stylistically always lowercase in user-facing text (owner directive 2026-08-10).
        # Technical identifiers (Swift types, target name, FWB* prefixes) keep standard casing.
        CFBundleDisplayName: fwb social
        # Sue Ellen Francisco — the expressive display face (owner directive
        # 2026-08-10). Registered here by FILENAME; `Font.custom` then resolves it
        # by its POSTSCRIPT name, `SueEllenFrancisco`. See Theme.Typography.Sue.
        UIAppFonts:
          - SueEllenFrancisco-Regular.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

  # Notification Service Extension (PLAN.md §4.3.5). The APNs payload carries
  # METADATA ONLY — conversation id, message id, sender id — because the server
  # holds ciphertext and cannot produce a preview. This extension fetches the
  # ciphertext plus this device's wrapped key over REST, decrypts on-device, and
  # rewrites the banner as a communication notification.
  #
  # Two files are compiled into BOTH targets rather than shared through a
  # framework: an extension cannot import its host app, and a framework for
  # ~300 lines is not worth the launch cost in a 24 MB budget.
  FWBSocialNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FWBSocialNotificationService
        excludes:
          - "FWBSocialNotificationService.entitlements"
      - path: FWBSocial/Services/Chat/ChatMessageDecryptor.swift
      - path: FWBSocial/Services/Chat/AppGroupStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: events.fwb.social.NotificationService
        PRODUCT_NAME: FWBSocialNotificationService
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: FWBSocialNotificationService/FWBSocialNotificationService.entitlements
        # `UNNotificationServiceExtension` overrides are nonisolated, and the
        # whole decrypt path runs off the main actor on URLSession's queue.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    info:
      path: FWBSocialNotificationService/Info.plist
      properties:
        CFBundleDisplayName: FWB Social Notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  FWBSocialTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FWBSocialTests
    dependencies:
      - target: FWBSocial
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: events.fwb.social.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # End-to-end smoke against the LIVE server (see FWBSocialUITests). Kept out of
  # the default scheme's test action on purpose — it creates and deletes a real
  # account, which is not something a routine `xcodebuild test` should do.
  FWBSocialUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FWBSocialUITests
    dependencies:
      - target: FWBSocial
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: events.fwb.social.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: FWBSocial
        # XCTestCase's `setUp`/`tearDown`/`init` are nonisolated, so the project's
        # default MainActor isolation makes every override an isolation mismatch.
        # The UI test runs out of process against the app anyway — there is no
        # app state here to protect.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
